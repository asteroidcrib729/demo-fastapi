[project]
name = "fastapi-prisma-records-api"
version = "1.0.0"
description = "A small FastAPI service that reads demonstration records from Prisma Postgres."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.139,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.51,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
